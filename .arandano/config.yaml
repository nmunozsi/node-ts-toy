project:
  name: node-ts-toy
  default_branch: main
  license: MIT
  stack: node-ts

executor:
  backend: docker
  docker:
    image: ghcr.io/nmunozsi/arandano-worker:latest
    workdir: /workspace
    plugins_mount: baked-in
    env_pass:
      - GH_TOKEN
      - ANTHROPIC_API_KEY

git:
  forge: github
  remote: origin
  branch_prefix: agent/
  open_pr: true

roles:
  coder:
    cli: claude-code
    model: claude-haiku-4-5-20251001
    tdd: strict

quality_defaults:
  format: required
  lint: required
  typecheck: required
  test: required
  coverage: { min: 80, delta: any }
  security: warn
  commit_msg: conventional
  reviewer_required: false

batching:
  max_parallel: 3
  timeout_minutes: 45
  retry_policy:
    max_attempts: 1
    on: [container_error, network_error]
